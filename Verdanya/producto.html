<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Detalle de plantas disponibles en Verdanya."
    >

    <meta
        name="theme-color"
        content="#285943"
    >

    <title>Planta | Verdanya</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/producto.css"
    >

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <header class="encabezado">

        <div class="contenedor encabezado-contenido">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
                aria-label="Verdanya - Inicio"
            >

                <span class="logo-icono">
                    V
                </span>

                <span>

                    <span class="logo-texto">
                        VERDANYA
                    </span>

                    <span class="logo-subtexto">
                        Plantas que dan vida
                    </span>

                </span>

            </a>


            <!-- NAVEGACIÓN -->

            <nav
                class="navegacion"
                aria-label="Navegación principal"
            >

                <a href="index.html">
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="activo"
                >
                    Plantas
                </a>

                <a href="categorias.html">
                    Categorías
                </a>

                <a href="contacto.html">
                    Contacto
                </a>

                <a
                    href="login.html"
                    class="boton-admin"
                >
                    🔐 Administración
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main>

        <section class="producto-pagina">

            <div class="contenedor">

                <div
                    id="producto-contenido"
                    class="producto-contenedor"
                >

                    <div class="estado-carga">
                        Cargando planta...
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         WHATSAPP FLOTANTE
    ====================================================== -->

    <a
        id="boton-whatsapp-general"
        class="whatsapp-flotante"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contactar por WhatsApp"
        title="Contactar por WhatsApp"
    >
        💬
    </a>


    <!-- =====================================================
         PIE DE PÁGINA
    ====================================================== -->

    <footer class="pie">

        <div class="contenedor">

            <div class="pie-grid">


                <!-- VERDANYA -->

                <div>

                    <h3>
                        VERDANYA
                    </h3>

                    <p>
                        Plantas que dan vida a tus espacios.
                    </p>

                </div>


                <!-- NAVEGACIÓN -->

                <div>

                    <h3>
                        Navegación
                    </h3>

                    <div class="pie-enlaces">

                        <a href="index.html">
                            Inicio
                        </a>

                        <a href="productos.html">
                            Plantas
                        </a>

                        <a href="categorias.html">
                            Categorías
                        </a>

                        <a href="contacto.html">
                            Contacto
                        </a>

                    </div>

                </div>


            </div>


            <!-- COPYRIGHT -->

            <div class="pie-final">

                ©
                <span id="anio-actual"></span>
                Verdanya.
                Todos los derechos reservados.

            </div>

        </div>

    </footer>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         JAVASCRIPT VERDANYA
    ====================================================== -->

    <script src="js/config.js"></script>

    <script src="js/supabase.js"></script>

    <script src="js/producto.js"></script>


</body>

</html>
